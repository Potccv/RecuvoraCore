[package]
name = "recuvora-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Stateless experience matching and repair computation for Recuvora"
publish = false
autobins = false
autotests = false

[lib]
name = "recuvora_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "business"
path = "tests/business.rs"
