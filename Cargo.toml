[package]
name = "recuvora-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Recovery business engine and commit-gated domain decisions for Recuvora"
publish = false
autobins = false
autotests = false

[lib]
name = "recuvora_core"
path = "src/lib.rs"

[dependencies]
im = { version = "15.1", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "business"
path = "tests/business.rs"

[[test]]
name = "approval"
path = "tests/approval.rs"

[[test]]
name = "commit"
path = "tests/commit.rs"

[[test]]
name = "knowledge"
path = "tests/knowledge.rs"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "engine"
path = "tests/engine.rs"
